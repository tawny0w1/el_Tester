Scroll this page and click the buttons on the LEFT; the RIGHT should show the same scroll and counters.</div>

<p>
  <button id="btn-a" class="count">Button A</button>
  <button id="btn-b" class="count">Button B</button>
</p>
<div id="markers"></div>
<p><button id="btn-bottom" class="count">Bottom button</button></p>
<script>
  // Tall page: numbered markers make it easy to compare scroll positions
  var m = document.getElementById('markers');
  for (var i = 1; i <= 120; i++) {
    var d = document.createElement('div');
    d.className = 'marker'; d.textContent = 'Marker ' + i;
    m.appendChild(d);
  }
</script>
